name: CareMan Cloud-Autopilot

# Wird von der App gestartet (workflow_dispatch), wenn der Dienstplan ohne Mac aus CareMan geholt werden soll.
# Zugangsdaten nur als verschlüsselte Repository-Secrets:
#   BRIDGE_GH_TOKEN  – fein abgestuftes Token nur für Jobacke/careman-autopilot-bridge (Issues + Contents: Lesen/Schreiben)
#   CAREMAN_USER     – Johanniter-Benutzername
#   CAREMAN_PASS     – Johanniter-Passwort
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careman-cloud
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CareMan Cloud-Autopilot
        env:
          BRIDGE_GH_TOKEN: ${{ secrets.BRIDGE_GH_TOKEN }}
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASS: ${{ secrets.CAREMAN_PASS }}
        run: node ./scripts/careman-cloud-runner.mjs
