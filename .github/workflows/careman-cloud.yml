name: CareMan Cloud-Autopilot

# Wird von der App gestartet (workflow_dispatch), wenn der Dienstplan ohne Mac aus CareMan geholt werden soll.
# Zusätzlich läuft täglich ein Selbsttest (Chrome startet, Johanniter-Seite lädt). Schlägt er fehl,
# wird der Lauf rot und GitHub schickt eine E-Mail – so fällt ein Problem auf, bevor man den Plan braucht.
# Zugangsdaten nur als verschlüsselte Repository-Secrets:
#   BRIDGE_GH_TOKEN  – fein abgestuftes Token nur für Jobacke/careman-autopilot-bridge (Issues + Contents: Lesen/Schreiben)
#   CAREMAN_USER     – Johanniter-Benutzername
#   CAREMAN_PASS     – Johanniter-Passwort
on:
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Nur Selbsttest (Chrome + Johanniter-Seite), kein Abruf'
        required: false
        default: 'false'
  schedule:
    - cron: '17 4 * * *' # täglich ca. 05:17/06:17 Uhr deutscher Zeit

permissions:
  contents: read

concurrency:
  group: careman-cloud-${{ github.event_name == 'schedule' && 'selftest' || github.event.inputs.selftest == 'true' && 'selftest' || 'run' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      # Eigenes, fest installiertes Chrome – unabhängig davon, was GitHub gerade im Server-Image mitliefert.
      # Schlägt die Installation fehl, nutzt der Runner automatisch das Chrome des Images.
      - name: Chrome bereitstellen
        id: chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: CareMan Cloud-Autopilot
        env:
          BRIDGE_GH_TOKEN: ${{ secrets.BRIDGE_GH_TOKEN }}
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASS: ${{ secrets.CAREMAN_PASS }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CLOUD_SELFTEST: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.selftest || 'false' }}
        run: node ./scripts/careman-cloud-runner.mjs
